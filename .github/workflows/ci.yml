name: Python core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run headless and mocked UI checks
        run: python tools/check_project.py
      - name: Set up JDK for extracted conveyor reference
        if: matrix.python-version == '3.10'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compare extracted Java conveyor transfers
        if: matrix.python-version == '3.10'
        run: python tools/check_conveyor_reference.py
