name: Python core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        include:
          - python-version: "3.10"
            numpy-version: "1.26.4"
          - python-version: "3.13"
            numpy-version: "2.3.5"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development-only NumPy for probe tests
        run: python -m pip install "numpy==${{ matrix.numpy-version }}"
      - name: Run headless and mocked UI checks
        run: python tools/check_project.py
      - name: Set up JDK for extracted transport references
        if: matrix.python-version == '3.10'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compare extracted Java conveyor transfers
        if: matrix.python-version == '3.10'
        run: python tools/check_conveyor_reference.py
      - name: Compare extracted Java drill dump selection
        if: matrix.python-version == '3.10'
        run: python tools/check_dump_reference.py
      - name: Compare extracted Java drill production offload
        if: matrix.python-version == '3.10'
        run: python tools/check_offload_reference.py
      - name: Compare extracted Java integrated transport
        if: matrix.python-version == '3.10'
        run: python tools/check_integrated_transport.py
